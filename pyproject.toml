[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md-vault-cli"
version = "1.0.0"
description = "A local Markdown knowledge base with full-text search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }
authors = [{ name = "nara-l98a" }]

[project.scripts]
mdvault = "mdvault.app:main"

[tool.setuptools.packages.find]
where = ["src"]
